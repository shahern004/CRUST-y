# Cargo configuration for CRUST-y Rust library
# Supports both Windows development (MinGW) and ARM baremetal targets

[build]
# Default target for Windows development (matches MinGW g++)
# Override with: cargo build --target thumbv8m.main-none-eabihf
target = "x86_64-pc-windows-gnu"

# ARM Cortex-M33 target configuration for STM32H573
[target.thumbv8m.main-none-eabihf]
rustflags = [
  "-C", "link-arg=-nostartfiles",     # We provide our own startup code
  "-C", "link-arg=-Wl,--gc-sections",  # Remove unused sections
]
