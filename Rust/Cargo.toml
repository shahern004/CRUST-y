[package]
name = "crustyV2-firmware"
version = "0.1.0"
edition = "2024"
authors = ["CRUST-y Development Team"]

[lib]
name = "crustyV2"
crate-type = ["staticlib"]

[dependencies]
# CXX with alloc support for no_std
cxx = { version = "1.0.187", default-features = false, features = ["alloc"] }

# Embedded heap allocator (64KB for CXX bridge)
embedded-alloc = "0.6"

# Critical section for baremetal
critical-section = { version = "1.1", features = ["restore-state-bool"] }

# Cortex-M support for STM32H573
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"

[build-dependencies]
cxx-build = "1.0"

[profile.release]
opt-level = "z"          # Optimize for size
lto = true               # Link-time optimization
codegen-units = 1        # Better optimization
debug = false
panic = "abort"          # No unwinding
strip = true             # Strip symbols
overflow-checks = false  # Disable overflow checks for size